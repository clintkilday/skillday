autoinstall:
  version: 1
  identity:
    hostname: ubuntu-desktop
    username: ${{ secrets.USERNAME }}
    password: ${{ secrets.PASSWORD }}
  storage:
    layout:
      name: lvm
  snaps:
    - name: bitwarden
      classic: false
    - name: notepad-plus-plus
      classic: false
    - name: openra
      classic: false
    - name: signal-desktop
      classic: false
  packages:
    - vim
  late-commands:
